# Render 블루프린트. 대시보드에서 이 저장소를 연결하면 이 파일대로 만들어진다.
#
# 값 세 개는 Render 대시보드에서 직접 넣는다(sync: false 라 저장소에 안 들어간다):
#   ANTHROPIC_API_KEY   앞에서 쓰던 것 그대로
#   SUPABASE_URL        https://<ref>.supabase.co
#   SUPABASE_ANON_KEY   공개 값. RLS 가 권한을 막으므로 숨길 필요가 없다
#
# service_role 키는 여기에 넣지 않는다. AI 프록시는 DB 를 만지지 않는다.
services:
  - type: web
    name: footballbanghwa-ai
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '22'
      # 우리 화면에서만 부를 수 있게 막는다. 주소가 바뀌면 같이 바꾼다.
      - key: ALLOWED_ORIGIN
        value: https://data2102.github.io
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
