# 폰에서 바로 열어 볼 수 있는 주소를 GitHub 이 대신 만들어 준다.
# 저장소 Settings > Pages > Source 를 "GitHub Actions" 로 한 번만 바꿔 두면,
# 이 브랜치에 push 할 때마다 모바일 웹이 자동으로 다시 올라간다.
#
# 저장소 Secrets 에 EXPO_PUBLIC_SUPABASE_URL / EXPO_PUBLIC_SUPABASE_ANON_KEY 를 넣으면
# 그대로 실제 서비스가 된다(여러 팀이 각자 로그인해서 쓰는 모드). 안 넣으면 데모 모드로 뜬다.
# anon 키는 원래 공개용이라 번들에 들어가도 된다 — 데이터는 RLS 가 막는다.
name: 모바일 웹 배포

on:
  push:
    branches: [claude/early-soccer-team-app-2uexcc, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: 웹 번들 만들기
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          # 화면에 어느 판인지 적어 둔다. "배포가 안 된 건가?"를 먼저 갈라내야 한다.
          EXPO_PUBLIC_BUILD: ${{ github.sha }}
          # AI 프록시(Render) 주소. 없으면 앱이 무엇을 해야 하는지 화면에 말해 준다.
          EXPO_PUBLIC_AI_URL: ${{ secrets.EXPO_PUBLIC_AI_URL }}
        run: npx expo export --platform web
      - name: Jekyll 끄기
        # _expo/ 처럼 밑줄로 시작하는 폴더를 GitHub Pages 가 통째로 버린다.
        run: touch dist/.nojekyll
      - name: 없는 주소는 첫 화면으로
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
