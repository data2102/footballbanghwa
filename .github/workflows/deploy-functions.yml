# AI 함수(Edge Function)를 push 할 때마다 자동으로 올린다.
#
# 전에는 맥북에서 npm run fn:deploy 를 해야 했다. 그래서 맥북 코드가 옛날이면
# 옛날 함수가 올라가고, 고친 게 반영이 안 되는데 이유는 안 보였다. 실제로
# 스키마 하나 고치는 데 그것 때문에 몇 번을 왕복했다.
#
# 저장소 Secrets 에 SUPABASE_ACCESS_TOKEN 하나만 넣으면 된다.
#   https://supabase.com/dashboard/account/tokens 에서 만든다.
# 프로젝트 주소는 이미 넣어 둔 EXPO_PUBLIC_SUPABASE_URL 에서 뽑아 쓴다.
#
# ANTHROPIC_API_KEY 는 여기서 다루지 않는다. 그건 Supabase 쪽 시크릿이고
# 한 번 넣어 두면 함수를 다시 올려도 그대로 남는다.
name: AI 함수 배포

on:
  push:
    branches: [claude/early-soccer-team-app-2uexcc, main]
    # 함수를 안 건드린 커밋까지 배포할 이유는 없다.
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-functions
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 토큰이 있는지 먼저 본다
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
        run: |
          # 토큰이 없으면 supabase CLI 가 영어 로그인 안내를 뱉고 끝난다.
          # 무엇을 해야 하는지 여기서 먼저 말해 준다.
          if [ -z "$TOKEN" ]; then
            echo "::error::저장소 Secrets 에 SUPABASE_ACCESS_TOKEN 이 없어요."
            echo "::error::https://supabase.com/dashboard/account/tokens 에서 만들어 넣어 주세요."
            exit 1
          fi
          if [ -z "$URL" ]; then
            echo "::error::EXPO_PUBLIC_SUPABASE_URL 이 없어요. 프로젝트 주소를 알 수 없습니다."
            exit 1
          fi

      - name: 프로젝트 주소에서 ref 를 뽑는다
        id: project
        env:
          URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
        run: |
          # https://<ref>.supabase.co -> <ref>
          ref="${URL#https://}"
          ref="${ref%%.supabase.co*}"
          if [ -z "$ref" ] || [ "$ref" = "$URL" ]; then
            echo "::error::EXPO_PUBLIC_SUPABASE_URL 이 https://<ref>.supabase.co 모양이 아니에요."
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: 함수 올리기
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy --project-ref "${{ steps.project.outputs.ref }}"
